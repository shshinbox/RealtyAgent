<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 40px;
            background: #f5f6f8;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 48px;
            border-radius: 14px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        h1 {
            margin-bottom: 8px;
        }
        .meta {
            color: #888;
            font-size: 13px;
            margin-bottom: 32px;
        }
        pre {
            white-space: pre-wrap;
            line-height: 1.7;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ title }}</h1>
        <div class="meta">생성 시각: {{ created_at }}</div>
        <pre>{{ content }}</pre>
    </div>
</body>
</html>
