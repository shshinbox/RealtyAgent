services:

  app:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - server/.env.docker
    environment:
      - APP_ENV=docker
      - CHECKPOINTS_DIR=/app/checkpoints_data
    volumes:
      - ./logs:/app/logs
      - checkpoints_data:/app/checkpoints_data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: python -m worker.main
    env_file:
      - server/.env.docker
    environment:
      - APP_ENV=docker
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: realty
      POSTGRES_PASSWORD: realty
      POSTGRES_DB: realty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realty -d realty"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "ls /qdrant/storage/raft_state.json || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/realty1234
      NEO4J_PLUGINS: '["apoc"]' # APOC 플러그인 설치
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*' # 보안 제한 해제
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j-admin", "server", "status"]
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  checkpoints_data:
