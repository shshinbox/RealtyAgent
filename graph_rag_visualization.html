                  edges = new vis.DataSet([{"from": "\uc544\uc774\uc5b8\ub9e8", "label": "Is hero of", "to": "\ub9c8\ube14 \uc720\ub2c8\ubc84\uc2a4"}, {"from": "\uc544\uc774\uc5b8\ub9e8", "label": "Led", "to": "\uc5b4\ubca4\uc838\uc2a4"}, {"from": "S\ud2f0\ube0c \ub85c\uc800\uc2a4", "label": "Is", "to": "\ucea1\ud2f4 \uc544\uba54\ub9ac\uce74"}, {"from": "\ucea1\ud2f4 \uc544\uba54\ub9ac\uce74", "label": "Is \ucc3d\ub9bd \uba64\ubc84 of", "to": "\uc5b4\ubca4\uc838\uc2a4"}, {"from": "\ud1a0\ub974", "label": "Is", "to": "\uc544\uc2a4\uac00\ub974\ub4dc\uc758 \uc2e0"}, {"from": "\ud1a0\ub974", "label": "Fought with", "to": "\uc5b4\ubca4\uc838\uc2a4"}, {"from": "\ud1a0\ub974", "label": "Fought against", "to": "\ud0c0\ub178\uc2a4"}, {"from": "\ud0c0\ub178\uc2a4", "label": "\uc774\uc6a9\ud574", "to": "\uc778\ud53c\ub2c8\ud2f0 \uac74\ud2c0\ub81b"}, {"from": "\ud0c0\ub178\uc2a4", "label": "\uc5c6\uc560\ub824 \ud588\ub2e4", "to": "\uc6b0\uc8fc\uc758 \uc808\ubc18"}, {"from": "\uc5b4\ubca4\uc838\uc2a4", "label": "\uad6c\uc131\ub41c\ub2e4", "to": "\ud5d0\ud06c"}, {"from": "\uc5b4\ubca4\uc838\uc2a4", "label": "\uad6c\uc131\ub41c\ub2e4", "to": "\ube14\ub799 \uc704\ub3c4\uc6b0"}]);

                  for (nodeId in allNodes) {

                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {

    "edges": {

    },
    "interaction": {

    "physics": {

};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
