<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RealtyAgent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- 토큰 설정 배너 (localStorage에 토큰이 없을 때만 표시) -->
  <div id="token-banner" class="token-banner" hidden>
    <span>JWT 토큰을 입력하세요</span>
    <input id="token-input" type="text" placeholder="eyJ..." class="token-input" />
    <button id="btn-set-token" class="btn-set-token">저장</button>
  </div>

  <div class="app">

    <!-- 왼쪽: 채팅 패널 -->
    <div class="chat-panel">
      <header class="chat-header">
        <span class="logo">RealtyAgent</span>
        <button id="btn-new-chat" class="btn-new">새 대화</button>
      </header>

      <div class="chat-messages" id="chat-messages"></div>

      <!-- human_reviewer 피드백 UI (기본 숨김) -->
      <div class="review-toolbar" id="review-toolbar" hidden>
        <p class="review-label">검토 후 다음 행동을 선택하세요</p>
        <div class="review-buttons">
          <button class="btn-review" data-action="replan">재계획</button>
          <button class="btn-review" data-action="rewrite">재작성</button>
          <button class="btn-review btn-approve" data-action="approve">승인</button>
        </div>
        <textarea id="review-comment" class="review-comment" placeholder="피드백 내용 (선택)"></textarea>
      </div>

      <!-- 기본 입력창 -->
      <div class="chat-input-area" id="chat-input-area">
        <textarea
          id="user-input"
          class="user-input"
          placeholder="질문을 입력하세요..."
          rows="1"
        ></textarea>
        <button id="btn-send" class="btn-send">전송</button>
      </div>
    </div>

    <!-- 오른쪽: 보고서 패널 -->
    <div class="report-panel">
      <header class="report-header">
        <span>보고서</span>
        <button id="btn-download" class="btn-download" hidden>다운로드</button>
      </header>
      <div class="report-content" id="report-content">
        <div class="report-placeholder">
          <p>대화를 시작하면 보고서가 이곳에 표시됩니다.</p>
        </div>
      </div>
    </div>

  </div>

  <script src="/static/chat.js"></script>
</body>
</html>
